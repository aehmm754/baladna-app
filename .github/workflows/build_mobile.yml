name: Build Baladna Mobile (Android APK & iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android Platform Files & Permissions
        working-directory: mobile_flutter
        run: |
          flutter create . --platforms=android --org sy.baladna --project-name baladna
          python3 ../.github/scripts/patch_android_manifest.py
      - name: Build Android APK & AAB
        working-directory: mobile_flutter
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SUPABASE_URL=https://keumobvevaxafrqzulcj.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_idHH0ndkiXyvcTpgHwjUgw_uVRXNG0
          flutter build appbundle --release --dart-define=SUPABASE_URL=https://keumobvevaxafrqzulcj.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_idHH0ndkiXyvcTpgHwjUgw_uVRXNG0
      - uses: actions/upload-artifact@v4
        with:
          name: baladna-android
          path: |
            mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
            mobile_flutter/build/app/outputs/bundle/release/app-release.aab

  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate iOS Platform Files & Info.plist
        working-directory: mobile_flutter
        run: |
          flutter create . --platforms=ios --org sy.baladna --project-name baladna
          python3 ../.github/scripts/patch_ios_plist.py
      - name: Build Unsigned iOS IPA
        working-directory: mobile_flutter
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=https://keumobvevaxafrqzulcj.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_idHH0ndkiXyvcTpgHwjUgw_uVRXNG0
          rm -rf Payload baladna_unsigned.ipa
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r baladna_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: baladna-ios-ipa
          path: mobile_flutter/baladna_unsigned.ipa
